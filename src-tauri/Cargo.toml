[package]
name = "hummingbird"
version = "0.4.0"
description = "Hummingbird - a local-first API client"
authors = ["zhongshaoqing"]
edition = "2024"

[lib]
name = "hummingbird_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
url = "2"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "multipart", "cookies", "stream", "socks"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
